name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python packages
        # the GPU/Whisper/Gemini/Gradio packages aren't needed: the tests use generated footage
        run: pip install "numpy<3" "opencv-python-headless<6" "yt-dlp[default]" pytest
      - name: Run tests
        run: python -m pytest tests -q
